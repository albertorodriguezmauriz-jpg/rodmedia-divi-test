<!-- ============================================================
     RM ARCHIVE SEARCH — Buscador + temas (plantilla de resultados)
     Va en la columna derecha de la sección rm-archive-hero.
     Los estilos están en rm-archive-hero.html.

     ANTES DE PUBLICAR: revisa que los slugs de categoría coincidan
     con los de Entradas > Categorías (son los mismos que en el blog).
     ============================================================ -->

<div class="rm-archive-search">
  <span class="rm-archive-search__label">Buscar en el blog</span>

  <form class="rm-archive-search__form" role="search" method="get" action="/">
    <label class="rm-archive-search__sr" for="rm-archive-s">Buscar en el blog</label>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
      <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <input id="rm-archive-s" type="search" name="s" placeholder="Ej.: Google, Kit Digital…" autocomplete="off">
    <input type="hidden" name="post_type" value="post">
    <button type="submit">Buscar</button>
  </form>

  <span class="rm-archive-search__label">Explorar temas</span>
  <nav class="rm-archive-search__chips" aria-label="Categorías del blog">
    <a href="/category/diseno-web/">Diseño web</a>
    <a href="/category/marketing-digital/">Marketing digital</a>
    <a href="/category/estrategia-digital/">Estrategia digital</a>
    <a href="/category/transformacion-digital/">Kit Digital y ayudas</a>
    <a href="/category/casos-de-exito/">Casos de éxito</a>
  </nav>
</div>
