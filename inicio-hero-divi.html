jQuery(document).ready(function($){
  var $hero = $(".sdo-hi");
  $hero.find(".sdo-in").each(function(i){
    this.style.transitionDelay = (0.15 + i * 0.12) + "s";
  });
  setTimeout(function(){ $hero.addClass("sdo-listo"); }, 60);
  var v = $hero.find(".sdo-hi-video").get(0);
  function sdoCubrir(){
    if (!v) { return; }
    var cont = v.parentNode;
    var cw = cont.offsetWidth;
    var ch = cont.offsetHeight;
    var vw = v.videoWidth;
    var vh = v.videoHeight;
    if (!vw) { return; }
    var util = 1;
    if (window.innerWidth <= 980) {
      util = parseFloat(v.getAttribute("data-contenido")) || 1;
    }
    var esc = Math.max(cw / vw, ch / (vh * util));
    var w = Math.ceil(vw * esc) + 2;
    var h = Math.ceil(vh * esc) + 2;
    v.style.setProperty("width", w + "px", "important");
    v.style.setProperty("height", h + "px", "important");
    v.style.setProperty("left", Math.round((cw - w) / 2) + "px", "important");
    v.style.setProperty("top", Math.round((ch - h) / 2) + "px", "important");
  }
  if (v) {
    v.addEventListener("loadedmetadata", sdoCubrir);
    $(window).on("resize orientationchange load", sdoCubrir);
    sdoCubrir();
    setTimeout(sdoCubrir, 600);
    setTimeout(sdoCubrir, 1800);
    if ("ResizeObserver" in window) {
      new ResizeObserver(sdoCubrir).observe(v.parentNode);
    }
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      v.removeAttribute("autoplay");
      v.pause();
    } else {
      v.muted = true;
      var p = v.play();
      if (p) { p.catch(function(){}); }
    }
  }
});
</script>
