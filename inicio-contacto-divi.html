<style>
.sdo-info{--sdo-acento:#0b8378;--sdo-naranja:#f39325;--sdo-naranja-osc:#e07f12;--sdo-texto:#555;max-width:1080px;margin:0 auto;position:relative;z-index:5}
.sdo-info p:empty,.sdo-info br{display:none!important}
.sdo-info *{box-sizing:border-box}
.sdo-info svg{flex:none}
.sdo-info-caja{display:grid;grid-template-columns:1.25fr 1fr 1fr auto;align-items:stretch;background:#fff;border:1px solid rgba(243,147,37,.55);border-radius:22px;box-shadow:0 18px 40px -24px rgba(0,0,0,.35);overflow:hidden}
.sdo-info a.sdo-info-item{display:flex;align-items:center;gap:14px;padding:22px 24px;text-decoration:none!important;color:var(--sdo-texto)!important;position:relative;transition:background .3s ease}
.sdo-info a.sdo-info-item+a.sdo-info-item::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:rgba(0,0,0,.1)}
.sdo-info a.sdo-info-item:hover{background:#f3faf8}
.sdo-info-ico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e8f4f2;color:var(--sdo-acento);flex:none;transition:transform .35s ease,background .35s ease,color .35s ease}
.sdo-info-ico svg{width:22px;height:22px}
.sdo-info a.sdo-info-item:hover .sdo-info-ico{background:var(--sdo-acento);color:#fff;transform:rotate(-8deg) scale(1.05)}
.sdo-info-item--wa .sdo-info-ico{background:#e7f8ee;color:#1fa855}
.sdo-info a.sdo-info-item--wa:hover .sdo-info-ico{background:#25d366;color:#fff}
.sdo-info-txt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.sdo-info-txt small{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sdo-naranja-osc);margin-bottom:3px}
.sdo-info-txt strong{font-size:16px;font-weight:600;color:#333;letter-spacing:.02em}
.sdo-info-reservar{display:flex;align-items:center;padding:16px 22px 16px 10px}
.sdo-info a.sdo-btn-reservar{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 30px;border-radius:999px;background:var(--sdo-naranja);color:#fff!important;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none!important;white-space:nowrap;box-shadow:0 12px 26px -12px rgba(243,147,37,.8);transition:transform .3s ease,background .3s ease,box-shadow .3s ease}
.sdo-info a.sdo-btn-reservar svg{width:18px;height:18px;transition:transform .3s ease}
.sdo-info a.sdo-btn-reservar:hover{background:var(--sdo-naranja-osc);transform:translateY(-3px);box-shadow:0 16px 30px -12px rgba(243,147,37,.9)}
.sdo-info a.sdo-btn-reservar:hover svg{transform:translateX(4px)}
@media (max-width:980px){.sdo-info-caja{grid-template-columns:1fr 1fr}.sdo-info a.sdo-info-item+a.sdo-info-item::before{display:none}.sdo-info a.sdo-info-item{border-bottom:1px solid rgba(0,0,0,.07)}.sdo-info a.sdo-info-item--dir{grid-column:1/-1}.sdo-info a.sdo-info-item--wa{border-right:1px solid rgba(0,0,0,.07)}.sdo-info-reservar{grid-column:1/-1;padding:16px 20px 20px}}
@media (max-width:560px){.sdo-info-caja{grid-template-columns:1fr;border-radius:18px}.sdo-info a.sdo-info-item{padding:16px 18px;gap:12px}.sdo-info a.sdo-info-item--wa{border-right:none}.sdo-info-ico{width:42px;height:42px}.sdo-info-txt strong{font-size:15.5px}.sdo-info-reservar{padding:14px 18px 18px}.sdo-info a.sdo-btn-reservar{padding:15px 20px}}
</style>
