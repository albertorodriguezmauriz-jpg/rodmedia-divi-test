<!-- =====================================================================
     ALQUIMIA DE COLOR · Asesorías · BLOQUE OPCIONAL · HUECO
     Envoltorio con fondo y contenedor de la marca para colocar JUSTO
     ANTES de un módulo nativo de Divi (p. ej. BookingPress) cuando haga
     falta un título o un texto introductorio.

     CÓMO USARLO
     1. Escribe el título y el texto dentro de los comentarios de abajo
        y quita las marcas de comentario de esas líneas.
     2. Fondo Arena: añade  ac-ase-fondo-arena  a la <section>.
        Fondo Crudo: déjala como está.
     3. Al módulo nativo que va debajo ponle la clase  ac-ase-modulo
        (y a su sección de Divi el mismo color de fondo).
     4. Si usas varios huecos, cambia el id del título para que no se repita.
     Requiere el bloque 00 (base).
     ===================================================================== -->

.ac-asesorias.ac-ase-sec-hueco .ac-ase-centrado .ac-ase-hueco-texto { margin-left: auto; margin-right: auto; }
</style>
