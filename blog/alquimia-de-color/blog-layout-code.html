<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500&display=swap');
/* ── Sección de Divi a ancho completo, sin paddings heredados ── */
.et_pb_section:has(.ac-bl-page) { padding: 0 !important; background-color: #F5F2ED !important; }
.et_pb_section:has(.ac-bl-page) .et_pb_row { width: 100% !important; max-width: none !important; padding: 0 !important; }
.et_pb_section:has(.ac-bl-page) .et_pb_column { margin: 0 !important; }
.ac-bl-page p:empty, .ac-bl-page > br { display: none !important; }
/* ── Variables de marca (escopadas) ── */
.ac-bl-page {
  --ac-bl-lino:   #F5F2ED;
  --ac-bl-dark:   #2C2C2B;
  --ac-bl-arena:  #E5DED1;
  --ac-bl-verde:  #4B5332;
  --ac-bl-marron: #8C7B6A;
  --ac-bl-white:  #FFFFFF;
  --ac-bl-radius: 6px;
  --ac-bl-trans:  0.38s ease;
  background: var(--ac-bl-lino);
  color: var(--ac-bl-dark);
  min-height: 60vh;
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}
.ac-bl-page *, .ac-bl-page *::before, .ac-bl-page *::after { box-sizing: border-box; }
/* ── Cabecera ── */
.ac-bl-header {
  text-align: center;
  padding: 96px 24px 72px;
  border-bottom: 1px solid var(--ac-bl-arena);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
/* Manchas botánicas difusas */
.ac-bl-header::before,
.ac-bl-header::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  z-index: -1;
  pointer-events: none;
}
.ac-bl-header::before {
  width: 420px; height: 420px;
  top: -180px; left: -120px;
  background: rgba(75, 83, 50, 0.14);
  animation: ac-bl-drift 18s ease-in-out infinite alternate;
}
.ac-bl-header::after {
  width: 360px; height: 360px;
  bottom: -200px; right: -100px;
  background: rgba(140, 123, 106, 0.18);
  animation: ac-bl-drift 22s ease-in-out infinite alternate-reverse;
}
@keyframes ac-bl-drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(40px, 30px) scale(1.12); }
}
.ac-bl-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-weight: 500;
  font-size: 0.7rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ac-bl-marron);
  margin-bottom: 18px;
}
.ac-bl-eyebrow::before,
.ac-bl-eyebrow::after {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--ac-bl-marron);
  opacity: 0.6;
}
.ac-bl-header h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: normal;
  font-size: clamp(2.4rem, 5vw, 3.6rem);
  color: var(--ac-bl-dark);
  line-height: 1.12;
  margin: 0 0 20px;
  padding: 0;
}
.ac-bl-header h1 em {
  font-style: normal;
  color: var(--ac-bl-verde);
}
.ac-bl-header-sub {
  font-weight: 300;
  font-size: 1rem;
  color: var(--ac-bl-marron);
  max-width: 460px;
  margin: 0 auto;
  padding: 0;
  line-height: 1.75;
}
.ac-bl-header-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 36px;
  color: var(--ac-bl-marron);
  font-size: 0.9rem;
}
.ac-bl-header-line::before,
.ac-bl-header-line::after {
  content: '';
  width: 48px;
  height: 1px;
  background: var(--ac-bl-arena);
}
/* ── Contenedor ── */
.ac-bl-container {
  max-width: 1140px;
  margin: 0 auto;
  padding: 56px 32px 96px;
}
/* ── Filtros por categoría ── */
.ac-bl-filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 0 0 48px;
  padding: 0;
  list-style: none;
}
.ac-bl-filters[hidden] { display: none; }
.ac-bl-chip {
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ac-bl-verde);
  background: transparent;
  border: 1px solid var(--ac-bl-arena);
  border-radius: 999px;
  padding: 10px 20px;
  cursor: pointer;
  transition: background var(--ac-bl-trans), color var(--ac-bl-trans), border-color var(--ac-bl-trans);
}
.ac-bl-chip:hover { border-color: var(--ac-bl-verde); }
.ac-bl-chip[aria-pressed="true"] {
  background: var(--ac-bl-verde);
  border-color: var(--ac-bl-verde);
  color: var(--ac-bl-lino);
}
.ac-bl-chip:focus-visible,
.ac-bl-page-btn:focus-visible,
.ac-bl-card a:focus-visible {
  outline: 2px solid var(--ac-bl-verde);
  outline-offset: 3px;
}
/* ── Grid ── */
.ac-bl-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}
/* ── Card ── */
.ac-bl-card {
  position: relative;
  background: var(--ac-bl-white);
  border: 1px solid var(--ac-bl-arena);
  border-radius: var(--ac-bl-radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow var(--ac-bl-trans), transform var(--ac-bl-trans), border-color var(--ac-bl-trans);
}
.ac-bl-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--ac-bl-verde);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--ac-bl-trans);
  z-index: 2;
}
.ac-bl-card:hover {
  box-shadow: 0 16px 40px rgba(44, 44, 43, 0.10);
  transform: translateY(-6px);
  border-color: transparent;
}
.ac-bl-card:hover::before { transform: scaleX(1); }
/* Revelado al hacer scroll (solo si el JS está activo) */
.ac-bl-js .ac-bl-reveal {
  opacity: 0;
  translate: 0 24px;
  transition: opacity 0.6s ease, translate 0.6s ease;
}
.ac-bl-js .ac-bl-reveal.ac-bl-visible {
  opacity: 1;
  translate: 0 0;
}
/* ── Imagen ── */
.ac-bl-card-img {
  display: block;
  overflow: hidden;
  aspect-ratio: 16 / 10;
  background: var(--ac-bl-arena);
  flex-shrink: 0;
}
.ac-bl-card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.7s ease;
}
.ac-bl-card:hover .ac-bl-card-img img { transform: scale(1.05); }
.ac-bl-card-img-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ac-bl-verde);
}
.ac-bl-card-img-placeholder svg { width: 48px; height: 48px; opacity: 0.35; }
/* ── Cuerpo ── */
.ac-bl-card-body {
  padding: 26px 26px 28px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.ac-bl-card-cat {
  position: relative;
  z-index: 3;
  align-self: flex-start;
  font-weight: 500;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ac-bl-verde);
  text-decoration: none;
  margin-bottom: 12px;
  transition: color var(--ac-bl-trans);
}
.ac-bl-card-cat:hover { color: var(--ac-bl-dark); }
.ac-bl-card-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: normal;
  font-size: 1.25rem;
  line-height: 1.3;
  color: var(--ac-bl-dark);
  margin: 0 0 14px;
  padding: 0;
}
.ac-bl-card-title a {
  color: inherit;
  text-decoration: none;
  transition: color var(--ac-bl-trans);
}
/* Toda la tarjeta clicable */
.ac-bl-card-title a::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
}
.ac-bl-card:hover .ac-bl-card-title a { color: var(--ac-bl-verde); }
.ac-bl-card-sep {
  width: 28px;
  height: 1px;
  background: var(--ac-bl-arena);
  margin-bottom: 14px;
  flex-shrink: 0;
}
.ac-bl-card-excerpt {
  font-weight: 300;
  font-size: 0.88rem;
  line-height: 1.78;
  color: var(--ac-bl-marron);
  margin: 0 0 24px;
  padding: 0;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ac-bl-card-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ac-bl-verde);
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid var(--ac-bl-arena);
  transition: gap var(--ac-bl-trans), color var(--ac-bl-trans);
}
.ac-bl-card-cta .ac-bl-arrow { transition: transform var(--ac-bl-trans); }
.ac-bl-card:hover .ac-bl-card-cta { color: var(--ac-bl-dark); gap: 12px; }
.ac-bl-card:hover .ac-bl-card-cta .ac-bl-arrow { transform: translateX(4px); }
/* ── Artículo destacado (primero de la página 1) ── */
.ac-bl-card--featured {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1.25fr 1fr;
}
.ac-bl-card--featured .ac-bl-card-img { aspect-ratio: auto; min-height: 380px; height: 100%; }
.ac-bl-card--featured .ac-bl-card-body { padding: 48px 44px; justify-content: center; }
.ac-bl-card--featured .ac-bl-card-title { font-size: clamp(1.6rem, 2.6vw, 2.1rem); line-height: 1.22; }
.ac-bl-card--featured .ac-bl-card-excerpt { font-size: 0.95rem; -webkit-line-clamp: 5; }
.ac-bl-card--featured .ac-bl-card-cta { margin-top: 28px; }
.ac-bl-badge {
  display: inline-block;
  align-self: flex-start;
  font-weight: 500;
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ac-bl-lino);
  background: var(--ac-bl-marron);
  border-radius: 999px;
  padding: 5px 12px;
  margin-bottom: 16px;
}
/* ── Skeleton de carga ── */
.ac-bl-skeleton {
  background: var(--ac-bl-white);
  border: 1px solid var(--ac-bl-arena);
  border-radius: var(--ac-bl-radius);
  overflow: hidden;
}
.ac-bl-skel-img { aspect-ratio: 16 / 10; }
.ac-bl-skel-line { height: 12px; margin: 0 26px 12px; border-radius: 4px; }
.ac-bl-skel-line:first-of-type { margin-top: 26px; width: 30%; }
.ac-bl-skel-line.ac-bl-w80 { width: calc(80% - 52px); height: 18px; }
.ac-bl-skel-line.ac-bl-w60 { width: calc(60% - 52px); margin-bottom: 28px; }
.ac-bl-skel-img,
.ac-bl-skel-line {
  background: linear-gradient(90deg, var(--ac-bl-arena) 0%, #EFEAE1 50%, var(--ac-bl-arena) 100%);
  background-size: 200% 100%;
  animation: ac-bl-shimmer 1.4s ease-in-out infinite;
}
@keyframes ac-bl-shimmer {
  from { background-position: 100% 0; }
  to   { background-position: -100% 0; }
}
/* ── Estados vacío / error ── */
.ac-bl-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 24px;
  color: var(--ac-bl-marron);
}
.ac-bl-empty p { font-weight: 300; font-size: 0.95rem; line-height: 1.75; margin: 0 0 20px; }
/* ── Paginación ── */
.ac-bl-pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 64px;
  padding-top: 48px;
  border-top: 1px solid var(--ac-bl-arena);
  flex-wrap: wrap;
}
.ac-bl-pagination[hidden] { display: none; }
.ac-bl-page-btn {
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ac-bl-verde);
  background: transparent;
  border: 1px solid var(--ac-bl-arena);
  border-radius: 999px;
  min-width: 42px;
  padding: 11px 18px;
  cursor: pointer;
  transition: background var(--ac-bl-trans), color var(--ac-bl-trans), border-color var(--ac-bl-trans);
}
.ac-bl-page-btn:hover,
.ac-bl-page-btn[aria-current="page"] {
  background: var(--ac-bl-verde);
  color: var(--ac-bl-lino);
  border-color: var(--ac-bl-verde);
}
.ac-bl-page-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.ac-bl-page-dots { color: var(--ac-bl-marron); padding: 0 4px; }
.ac-bl-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* ── Responsive ── */
@media (max-width: 980px) {
  .ac-bl-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .ac-bl-card--featured { grid-template-columns: 1fr; }
  .ac-bl-card--featured .ac-bl-card-img { min-height: 0; aspect-ratio: 16 / 9; }
  .ac-bl-card--featured .ac-bl-card-body { padding: 32px 28px; }
}
@media (max-width: 640px) {
  .ac-bl-grid { grid-template-columns: 1fr; }
  .ac-bl-container { padding: 40px 18px 72px; }
  .ac-bl-header { padding: 64px 20px 48px; }
  .ac-bl-filters { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; margin: 0 -18px 36px; padding: 0 18px 6px; scrollbar-width: none; }
  .ac-bl-filters::-webkit-scrollbar { display: none; }
  .ac-bl-chip { flex-shrink: 0; }
  .ac-bl-card-body { padding: 22px 20px 24px; }
  .ac-bl-card-title { font-size: 1.15rem; }
  .ac-bl-page-btn.ac-bl-txt { padding: 11px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .ac-bl-page *, .ac-bl-page *::before, .ac-bl-page *::after { animation: none !important; transition: none !important; }
  .ac-bl-js .ac-bl-reveal { opacity: 1; translate: 0 0; }
}
</style>

<div class="ac-bl-page" id="ac-bl-page">
  <header class="ac-bl-header">
    <span class="ac-bl-eyebrow">Coloración vegetal · Método AMAR</span>
    <h1>El Blog de<br><em>Alquimia de Color</em></h1>
    <p class="ac-bl-header-sub">Artículos honestos sobre plantas, mezclas y el arte de cuidar tu cabello a tu ritmo.</p>
    <div class="ac-bl-header-line" aria-hidden="true"><span>✦</span></div>
  </header>
  <div class="ac-bl-container">
    <nav aria-label="Filtrar artículos por categoría">
      <div id="ac-bl-filters" class="ac-bl-filters" hidden></div>
    </nav>
    <p id="ac-bl-status" class="ac-bl-sr" aria-live="polite"></p>
    <div id="ac-bl-grid" class="ac-bl-grid" aria-busy="true"></div>
    <nav id="ac-bl-pagination" class="ac-bl-pagination" aria-label="Paginación del blog" hidden></nav>
  </div>
  <noscript>
    <p style="text-align:center;padding:0 24px 72px;color:#8C7B6A;">Activa JavaScript para ver los artículos o visita el <a href="/feed/" style="color:#4B5332;">listado de entradas</a>.</p>
  </noscript>
</div>

<script>
(function () {
  /* ── Configuración ── */
  var BASE_URL    = window.location.origin;  /* Mismo dominio de la web */
  var PER_PAGE    = 7;                        /* 1 destacado + 6 en la página 1 */
  var EXCERPT_LEN = 160;
  /* ── Estado ── */
  var state = { page: 1, cat: 0, totalPages: 1, firstLoad: true, req: 0 };
  var categories = {};
  /* ── DOM ── */
  var root       = document.getElementById('ac-bl-page');
  var grid       = document.getElementById('ac-bl-grid');
  var pagination = document.getElementById('ac-bl-pagination');
  var filters    = document.getElementById('ac-bl-filters');
  var statusEl   = document.getElementById('ac-bl-status');
  if (!root) { return; }
  if (!grid) { return; }
  var canReveal = 'IntersectionObserver' in window;
  if (canReveal) { root.classList.add('ac-bl-js'); }
  /* ── Helpers ── */
  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function decode(html) {
    var tmp = document.createElement('textarea');
    tmp.innerHTML = html || '';
    return tmp.value;
  }
  function cleanExcerpt(html, max) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    var text = (tmp.textContent || '').replace(/\[(&hellip;|…)\]/g, '').replace(/\s+/g, ' ').trim();
    if (text.length > max) { text = text.substring(0, max).replace(/\s+\S*$/, '') + '…'; }
    return text;
  }
  function getMedia(post) {
    var emb = post._embedded || {};
    var m = emb['wp:featuredmedia'];
    if (!m) { return null; }
    if (!m[0]) { return null; }
    if (!m[0].source_url) { return null; }
    return m[0];
  }
  function getCat(post) {
    var emb = post._embedded || {};
    var t = emb['wp:term'];
    if (!t) { return null; }
    if (!t[0]) { return null; }
    return t[0][0] || null;
  }
  function imgHTML(post, title, featured) {
    var m = getMedia(post);
    if (!m) {
      return '<div class="ac-bl-card-img-placeholder" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 38c18 0 28-12 28-28C20 10 10 22 10 38Z" stroke-linejoin="round"/><path d="M10 38 26 22" stroke-linecap="round"/></svg></div>';
    }
    var sizes = (m.media_details || {}).sizes || {};
    var pick = featured ? (sizes.large || sizes.medium_large) : (sizes.medium_large || sizes.large);
    var src = pick ? pick.source_url : m.source_url;
    var srcset = [];
    ['medium', 'medium_large', 'large', 'full'].forEach(function (k) {
      if (sizes[k]) { srcset.push(sizes[k].source_url + ' ' + sizes[k].width + 'w'); }
    });
    var alt = m.alt_text || title;
    return '<img src="' + esc(src) + '"' +
      (srcset.length ? ' srcset="' + esc(srcset.join(', ')) + '" sizes="' + (featured ? '(max-width: 980px) 100vw, 640px' : '(max-width: 640px) 100vw, (max-width: 980px) 50vw, 360px') + '"' : '') +
      ' alt="' + esc(alt) + '"' + (featured ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async">';
  }
  /* ── Tarjeta ── */
  function buildCard(post, featured) {
    var title   = decode(post.title.rendered);
    var url     = post.link;
    var excerpt = cleanExcerpt(post.excerpt.rendered, featured ? 260 : EXCERPT_LEN);
    var cat     = getCat(post);
    var card = document.createElement('article');
    card.className = 'ac-bl-card ac-bl-reveal' + (featured ? ' ac-bl-card--featured' : '');
    card.innerHTML =
      '<div class="ac-bl-card-img">' + imgHTML(post, title, featured) + '</div>' +
      '<div class="ac-bl-card-body">' +
        (featured ? '<span class="ac-bl-badge">Último artículo</span>' : '') +
        (cat ? '<a class="ac-bl-card-cat" href="' + esc(cat.link) + '">' + esc(decode(cat.name)) + '</a>' : '') +
        '<h2 class="ac-bl-card-title"><a href="' + esc(url) + '">' + esc(title) + '</a></h2>' +
        '<div class="ac-bl-card-sep"></div>' +
        (excerpt ? '<p class="ac-bl-card-excerpt">' + esc(excerpt) + '</p>' : '') +
        '<span class="ac-bl-card-cta" aria-hidden="true">Leer artículo <span class="ac-bl-arrow">→</span></span>' +
      '</div>';
    return card;
  }
  /* ── Revelado ── */
  var observer = null;
  if (canReveal) {
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          var el = entry.target;
          el.classList.add('ac-bl-visible');
          observer.unobserve(el);
          setTimeout(function () { el.style.transitionDelay = ''; }, 900);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  }
  /* ── Skeleton ── */
  function showSkeleton() {
    var html = '';
    for (var i = 0; i < 6; i++) {
      html += '<div class="ac-bl-skeleton" aria-hidden="true"><div class="ac-bl-skel-img"></div><div class="ac-bl-skel-line"></div><div class="ac-bl-skel-line ac-bl-w80"></div><div class="ac-bl-skel-line ac-bl-w60"></div></div>';
    }
    grid.innerHTML = html;
    grid.setAttribute('aria-busy', 'true');
  }
  /* ── Render ── */
  function renderPosts(posts) {
    grid.innerHTML = '';
    grid.setAttribute('aria-busy', 'false');
    if (!posts.length) {
      grid.innerHTML = '<div class="ac-bl-empty"><p>Todavía no hay artículos publicados.<br>Vuelve pronto — la alquimia está en proceso.</p></div>';
      statusEl.textContent = 'No hay artículos.';
      return;
    }
    var useFeatured = state.page === 1;
    posts.forEach(function (post, i) {
      var featured = useFeatured ? i === 0 : false;
      var card = buildCard(post, featured);
      card.style.transitionDelay = ((i % 3) * 90) + 'ms';
      grid.appendChild(card);
      if (observer) { observer.observe(card); }
    });
    statusEl.textContent = 'Página ' + state.page + ' de ' + state.totalPages + ' cargada.';
  }
  function pageButton(label, page, opts) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ac-bl-page-btn' + (opts.txt ? ' ac-bl-txt' : '');
    btn.innerHTML = label;
    if (opts.aria) { btn.setAttribute('aria-label', opts.aria); }
    if (opts.current) { btn.setAttribute('aria-current', 'page'); }
    if (opts.disabled) { btn.disabled = true; }
    btn.addEventListener('click', function () { go(page, state.cat); });
    return btn;
  }
  function renderPagination() {
    pagination.innerHTML = '';
    var total = state.totalPages;
    var cur = state.page;
    if (total <= 1) { pagination.hidden = true; return; }
    pagination.hidden = false;
    pagination.appendChild(pageButton('←<span class="ac-bl-sr"> Anterior</span>', cur - 1, { txt: true, aria: 'Página anterior', disabled: cur === 1 }));
    var last = 0;
    for (var p = 1; p <= total; p++) {
      var show = p === 1 || p === total || Math.abs(p - cur) <= 1;
      if (show) {
        if (p - last > 1) {
          var dots = document.createElement('span');
          dots.className = 'ac-bl-page-dots';
          dots.textContent = '…';
          pagination.appendChild(dots);
        }
        pagination.appendChild(pageButton(String(p), p, { current: p === cur, aria: 'Página ' + p }));
        last = p;
      }
    }
    pagination.appendChild(pageButton('<span class="ac-bl-sr">Siguiente </span>→', cur + 1, { txt: true, aria: 'Página siguiente', disabled: cur === total }));
  }
  function renderError() {
    grid.setAttribute('aria-busy', 'false');
    grid.innerHTML = '<div class="ac-bl-empty"><p>No se han podido cargar los artículos.<br>Inténtalo de nuevo en unos momentos.</p><button type="button" class="ac-bl-page-btn" id="ac-bl-retry">Reintentar</button></div>';
    var retry = document.getElementById('ac-bl-retry');
    if (retry) { retry.addEventListener('click', function () { load(); }); }
  }
  /* ── Filtros ── */
  function renderFilters(list) {
    var useful = list.filter(function (c) { return c.count > 0; });
    if (useful.length < 2) { return; }
    var html = '<button type="button" class="ac-bl-chip" data-cat="0">Todos</button>';
    useful.forEach(function (c) {
      categories[c.id] = c;
      html += '<button type="button" class="ac-bl-chip" data-cat="' + c.id + '">' + esc(decode(c.name)) + '</button>';
    });
    filters.innerHTML = html;
    filters.hidden = false;
    syncFilters();
    filters.addEventListener('click', function (e) {
      var btn = e.target.closest('.ac-bl-chip');
      if (!btn) { return; }
      go(1, parseInt(btn.getAttribute('data-cat'), 10) || 0);
    });
  }
  function syncFilters() {
    var chips = filters.querySelectorAll('.ac-bl-chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].setAttribute('aria-pressed', String(parseInt(chips[i].getAttribute('data-cat'), 10) === state.cat));
    }
  }
  /* ── URL compartible (?pagina=2&categoria=5) ── */
  function readURL() {
    var params = new URLSearchParams(window.location.search);
    state.page = Math.max(1, parseInt(params.get('pagina'), 10) || 1);
    state.cat  = Math.max(0, parseInt(params.get('categoria'), 10) || 0);
  }
  function writeURL() {
    var params = new URLSearchParams(window.location.search);
    if (state.page > 1) { params.set('pagina', state.page); } else { params.delete('pagina'); }
    if (state.cat) { params.set('categoria', state.cat); } else { params.delete('categoria'); }
    var qs = params.toString();
    history.pushState({ acbl: true }, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
  }
  function go(page, cat) {
    state.page = page;
    state.cat = cat;
    writeURL();
    syncFilters();
    load();
  }
  window.addEventListener('popstate', function () {
    readURL();
    syncFilters();
    load();
  });
  /* ── Carga vía API REST ── */
  function load() {
    var reqId = ++state.req;
    if (state.firstLoad) {
      state.firstLoad = false;
    } else {
      var top = root.querySelector('.ac-bl-container').getBoundingClientRect().top + window.pageYOffset - 100;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }
    showSkeleton();
    pagination.hidden = true;
    var url = BASE_URL + '/wp-json/wp/v2/posts' +
      '?per_page=' + (state.page === 1 ? PER_PAGE : PER_PAGE - 1) +
      '&offset=' + (state.page === 1 ? 0 : PER_PAGE + (state.page - 2) * (PER_PAGE - 1)) +
      '&_embed=wp:featuredmedia,wp:term' +
      (state.cat ? '&categories=' + state.cat : '');
    fetch(url)
      .then(function (res) {
        if (!res.ok) { throw new Error('API ' + res.status); }
        var total = parseInt(res.headers.get('X-WP-Total') || '0', 10);
        state.totalPages = total <= PER_PAGE ? 1 : 1 + Math.ceil((total - PER_PAGE) / (PER_PAGE - 1));
        return res.json();
      })
      .then(function (posts) {
        if (reqId !== state.req) { return; }
        if (state.page > state.totalPages) {
          if (state.totalPages > 0) { go(1, state.cat); return; }
        }
        renderPosts(posts || []);
        renderPagination();
      })
      .catch(function (err) {
        if (reqId !== state.req) { return; }
        console.warn('ac-bl: error cargando artículos →', err);
        renderError();
      });
  }
  /* ── Init ── */
  readURL();
  fetch(BASE_URL + '/wp-json/wp/v2/categories?per_page=50&hide_empty=true&orderby=count&order=desc')
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(renderFilters)
    .catch(function () {});
  load();
})();
</script>
